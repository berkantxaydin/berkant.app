name: proglem CI/CD & AI Review

on:
  push:
    branches: [ "main", "dev" ]
  pull_request:
    branches: [ "main", "dev" ]

# Grant permission to the Action to leave comments on Pull Requests
permissions:
  contents: read
  pull-requests: write 

jobs:
  test-and-scan:
    name: Lint, Test, and Security Scan
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install flake8 pytest bandit
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi
        
    - name: Lint with flake8
      run: |
        # Stop the build if there are syntax errors or undefined names
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        
    - name: Security scan with bandit
      run: |
        # Scan for common vulnerabilities (specifically SQL injection)
        # We skip the venv directory if it exists
        bandit -r . -x ./venv -ll -ii
        
    - name: Test with pytest
      run: pytest

  gemini-pr-review:
    name: Gemini AI Code Review
    # Only run this job if the tests passed AND it is a Pull Request
    if: github.event_name == 'pull_request'
    needs: test-and-scan
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0 # Required to fetch the full git diff
        
    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"
        
    - name: Install AI SDK
      run: pip install google-generativeai requests
      
    - name: Run Gemini Code Review
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
        REPO_NAME: ${{ github.repository }}
      run: python scripts/gemini_pr_review.py