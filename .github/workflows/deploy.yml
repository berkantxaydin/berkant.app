name: Continuous Deployment

on:
  push:
    branches: [ "main" ]
    
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  deploy:
    name: Build & Deploy to Production
    runs-on: self-hosted
    
    steps:
    - name: Pre-Deployment Stage (Global Lock Release)
      shell: cmd
      run: |
        git config --global core.fsmonitor false
        git config --global --add safe.directory "C:/Users/berka/Downloads/berkant.app"
        taskkill /F /IM git.exe /T /FI "STATUS eq RUNNING" || exit /b 0
        taskkill /F /IM node.exe /T /FI "STATUS eq RUNNING" || exit /b 0
        powershell -ExecutionPolicy Bypass -File C:\Users\berka\Downloads\berkant.app\scripts\cleanup_runner.ps1

    - name: Native Git Checkout (Surgical)
      uses: actions/checkout@v6
      with:
        ref: main
        clean: true
        fetch-depth: 1

    - name: Sync to Production (Mirror)
      shell: cmd
      run: |
        robocopy "." "C:\Users\berka\Downloads\berkant.app" /MIR /XF ".env" "*.db" "*.db-wal" "*.db-shm" /XD "venv" ".git" "actions-runner" "runner_work" ".venv" ".github" "models" "uploads" "db" "logs" "mock_s3" /R:2 /W:5
        if %ERRORLEVEL% GEQ 8 exit /b %ERRORLEVEL%
        exit /b 0

    - name: Post-Deployment Stage (Startup & Heal)
      shell: cmd
      env:
        RUNNER_TRACKING_ID: ""
      run: |
        powershell -ExecutionPolicy Bypass -File C:\Users\berka\Downloads\berkant.app\scripts\restart_server.ps1

    - name: Verify Health
      shell: cmd
      run: |
        echo "SUCCESS: Native Windows Deployment successful!"