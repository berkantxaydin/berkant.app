name: 🚀 Continuous Deployment

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    name: Build & Deploy to Production
    runs-on: self-hosted
    
    steps:
    - name: Native Git Checkout
      shell: powershell
      run: |
        # 1. Force kill any existing locks
        Get-Process -Name git, git-remote-https, fsmonitor -ErrorAction SilentlyContinue | Stop-Process -Force
        
        # 2. Manual Auth using GITHUB_TOKEN
        $auth = [System.Convert]::ToBase64String([System.Text.Encoding]::ASCII.GetBytes("x-access-token:${{ secrets.GITHUB_TOKEN }}"))
        git config --local http.https://github.com/.extraheader "AUTHORIZATION: basic $auth"
        
        # 3. Native Fetch and Checkout
        git fetch --no-tags --prune --depth=1 origin main
        git checkout -f main
        
        # 4. Cleanup auth for security
        git config --local --unset http.https://github.com/.extraheader

    - name: Run Native Deployment Script
      shell: powershell
      run: |
        .\scripts\restart_server.ps1

    - name: Verify Health
      run: |
        echo "✅ Native Windows Deployment successful!"
