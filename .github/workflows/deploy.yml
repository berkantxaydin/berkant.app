name: 🚀 Continuous Deployment

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    name: Build & Deploy to Production
    runs-on: self-hosted
    
    steps:
    - name: Native Git Checkout
      shell: cmd
      run: |
        powershell -ExecutionPolicy Bypass -Command "Get-Process -Name git, git-remote-https, fsmonitor -ErrorAction SilentlyContinue | Stop-Process -Force"
        powershell -ExecutionPolicy Bypass -Command "$auth = [System.Convert]::ToBase64String([System.Text.Encoding]::ASCII.GetBytes(\"x-access-token:${{ secrets.GITHUB_TOKEN }}\")); git config --local http.https://github.com/.extraheader \"AUTHORIZATION: basic $auth\""
        git fetch --no-tags --prune --depth=1 origin main
        git checkout -f main
        git config --local --unset http.https://github.com/.extraheader

    - name: Sync to Production
      shell: cmd
      run: |
        robocopy "." "C:\Users\berka\Downloads\berkant.app" /MIR /XF ".env" /XD "venv" ".git" "actions-runner" "runner_work" ".venv" ".github"
        if %ERRORLEVEL% GEQ 8 exit /b %ERRORLEVEL%
        exit /b 0

    - name: Run Native Deployment Script
      shell: cmd
      run: |
        powershell -ExecutionPolicy Bypass -File .\scripts\restart_server.ps1

    - name: Verify Health
      shell: cmd
      run: |
        echo "✅ Native Windows Deployment successful!"
