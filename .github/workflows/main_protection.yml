name: Merge Protection (Main)

on:
  pull_request:
    branches:
      - main

jobs:
  enforce-dev-source:
    runs-on: ubuntu-latest
    steps:
      - name: Verify Source Branch
        shell: bash
        run: |
          echo "Checking source branch: ${{ github.head_ref }}"
          if [[ "${{ github.head_ref }}" != "dev" ]]; then
            echo "❌ ERROR: Merges into 'main' are only allowed from the 'dev' branch."
            echo "Please merge your feature branch into 'dev' first, then create a PR from 'dev' to 'main'."
            exit 1
          fi
          echo "✅ Source branch is 'dev'. Proceeding."
