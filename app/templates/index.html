<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>proglem Platform Engine</title>
    <!-- Pico.css Minimal styling -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@picocss/pico@2/css/pico.classless.min.css">
    <!-- HTMX for JavaScript-less dynamic behavior -->
    <script src="https://unpkg.com/htmx.org@1.9.10"></script>
    <style>
        .thinking {
            animation: pulse 1.5s infinite;
            color: var(--pico-muted-color);
        }
        @keyframes pulse {
            0% { opacity: 0.5; }
            50% { opacity: 1; }
            100% { opacity: 0.5; }
        }
    </style>
</head>
<body>
    <main>
        <header>
            <h1>proglem AI Chat</h1>
            <p>Welcome to the lightning-fast, zero-JS CV and Godot assistant, powered by our local local LLM pipeline.</p>
        </header>

        <!-- HTMX form interacting directly with /ai/ask -->
        <article>
            <form hx-post="/ai/ask" hx-target="#chat-result" hx-swap="outerHTML">
                <label for="prompt">Your Message:</label>
                <input type="text" id="prompt" name="prompt" placeholder="E.g. How do I optimize a Godot rendering loop?" required>
                <button type="submit">Ask the Proglem AI</button>
            </form>
        </article>

        <!-- Dynamic render zone for HTMX swap -->
        <div id="chat-result" style="margin-top: 2rem;">
            <!-- The result block or polling indicator is swapped in here -->
        </div>
        
    </main>
</body>
</html>
