{% for comment in comments %}
    {% set can_delete = is_admin or (comment.user_id == current_user_id) %}
    
    <article style="padding: 1rem; margin-bottom: 1rem; background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.1);">
        <header style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.5rem; background: transparent; border: 0; padding: 0;">
            <strong>@{{ comment.username | e }}</strong>
            <small>{{ comment.created_at | e }}</small>
        </header>
        <p style="margin-bottom: 0.5rem;">{{ comment.content | e }}</p>
        {% if can_delete %}
        <footer style="margin-top: 0.5rem; text-align: right; background: transparent; border: 0; padding: 0;">
            <a href="#" hx-delete="/api/comments/{{ comment.id }}" hx-target="closest article" hx-swap="outerHTML" class="contrast" style="font-size: 0.8rem;">{{ t('Delete') }}</a>
        </footer>
        {% endif %}
    </article>
{% endfor %}

<form hx-post="/api/games/{{ game_id }}/comments" hx-target="#comment-list" hx-on::after-request="this.reset()" style="margin-top: 1.5rem;">
    <fieldset role="group">
        <input type="text" name="content" placeholder="{{ t('Write a comment...') }}" required>
        <button type="submit" class="outline">{{ t('Post') }}</button>
    </fieldset>
</form>
