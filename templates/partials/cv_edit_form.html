<form hx-put="/api/cv/{{ cv.id }}" hx-target="closest article" hx-swap="outerHTML">
    <label>{{ t('Title') }}
        <input type="text" name="title" value="{{ cv.title | e }}" required>
    </label>
    <label>{{ t('Location') }}
        <input type="text" name="location" value="{{ cv.location | e or '' }}" placeholder="e.g. Istanbul, Turkey">
    </label>
    <label>{{ t('Summary') }}
        <textarea name="summary" required>{{ cv.summary | e }}</textarea>
    </label>
    <div class="grid">
        <button type="submit">{{ t('Save Changes') }}</button>
        <button type="button" class="secondary" onclick="window.location.reload()">{{ t('Cancel') }}</button>
    </div>
</form>
