{% extends "base.html" %}

{% block title %}Login - proglem{% endblock %}

{% block content %}
<section style="display: flex; justify-content: center; align-items: center; min-height: 70vh;">
  <article class="glass-panel" style="width: 100%; max-width: 400px;">
    <hgroup class="text-center">
      <h2 class="accent-text">Welcome Back</h2>
      <p>Sign in to manage your CV and Games</p>
    </hgroup>
    
    {% if error %}
    <p style="color: var(--pico-del-color);"><strong>{{ error }}</strong></p>
    {% endif %}

    <form method="POST" action="/login">
      <label>
        Username
        <input type="text" name="username" required>
      </label>
      <label>
        Password
        <input type="password" name="password" required>
      </label>
      <label>
        <input type="checkbox" name="remember">
        Remember me
      </label>
      <button type="submit" class="contrast">Sign In</button>
    </form>
    
    <footer class="text-center">
      <small>Don't have an account? <a href="/register">Register</a></small>
    </footer>
  </article>
</section>
{% endblock %}
