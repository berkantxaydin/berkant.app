{% extends "base.html" %}

{% block content %}
<section>
  <hgroup>
    <h1 class="accent-text">System Dashboard</h1>
    <p>Real-time RimWorld multiplayer analytics and Local AI monitor</p>
  </hgroup>

  <div class="grid">
    <!-- RIMWORLD POLLING DASHBOARD -->
    <article class="glass-panel">
      <header>RimWorld Server Status</header>
      
      <!-- HTMX automatically polls /api/server_status every 10 seconds -->
      <div id="rimworld-stats" hx-get="/api/server_status" hx-trigger="load, every 10s" hx-swap="innerHTML">
        <p aria-busy="true">Connecting to Game Server...</p>
      </div>
      
    </article>

    <!-- LOCAL RAM-SAFE AI -->
    <article class="glass-panel">
      <header>LFM 2.5-Thinking (1.2B)</header>
      <form hx-post="/ai/ask" hx-target="#chat-result-container" hx-swap="innerHTML">
        <fieldset role="group">
          <input type="text" name="prompt" placeholder="Ask the local Assistant..." required>
          <button type="submit" class="outline">Send</button>
        </fieldset>
      </form>
      <div id="chat-result-container" style="margin-top: 1rem; padding: 1rem; background: rgba(0,0,0,0.2); border-radius: 8px; min-height: 80px;">
        <div id="chat-result">
            <em>AI is idle...</em>
        </div>
      </div>
    </article>
  </div>
</section>

{% endblock %}
