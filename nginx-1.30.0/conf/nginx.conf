
worker_processes  1;

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    types_hash_max_size 2048;
    client_max_body_size 5M;

    # Gzip Compression
    gzip on;
    gzip_disable "msie6";
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;

    upstream flask_app {
        server 127.0.0.1:5000;
    }

    server {
        listen       80;
        server_name  localhost;

        # Security Headers
        add_header X-Frame-Options "SAMEORIGIN";
        add_header X-XSS-Protection "1; mode=block";
        add_header X-Content-Type-Options "nosniff";

        # Static file serving (Update these paths to absolute Windows paths)
        location /static/ {
            alias "C:/Users/berka/Downloads/berkant.app/app/static/";
            expires 30d;
            add_header Cache-Control "public, no-transform, immutable";
        }

        # Main App Proxy
        location / {
            proxy_pass http://flask_app;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            
            # Support for HTMX dynamic polling
            proxy_buffering off;
            proxy_read_timeout 300s;
        }

        # AI Service Proxy (DISABLED: Conflicts with Flask /ai routes. AI core is handled internally)
        # location /ai/ {
        #    rewrite ^/ai/(.*) /$1 break;
        #    proxy_pass http://127.0.0.1:8082;
        #    proxy_set_header Host $host;
        # }

        error_page   500 502 503 504  /50x.html;
        location = /50x.html {
            root   html;
        }
    }
}
